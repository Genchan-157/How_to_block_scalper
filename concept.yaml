# 人気商品の売り方
転売屋による買い占めで利益が流れるのを防ぎ、生産者に適正な利益が入ることを目指す。

## 生産量が限られている量産品の場合
- 手付金制度を導入する
  - 2000万円の商品なら200万円など、10%程度。
  - 納入予定日の1ヶ月前の所有者が、詳細仕様を決めて代金を払って現物を手に入れるか、手付を放棄する権利を持つ（解約手付）。
  - マイナーチェンジがあった場合も同等の商品に対する手付金としてそのまま購入代金に充当できる。
  - モデルの製造が打ち切りになった時は、メーカーは現在の権利保有者に額面分を返金して権利を買い戻す
      - 解約手付の「倍返し」ではなく単に買い戻し。
      - 買い手の意思で他の商品の手付の購入費用に回しても良い
      
- 手付の失効条件
  - 納入予定日の1ヶ月前の連絡に1ヶ月応答しない場合
  - 確定した現物の引渡し日までに残りの代金を支払えない場合
  - 確定した現物の引き渡し日に、引き渡し場所に取りに来れない場合
  - 買取申し入れに対して、2週間以上応答しなかった場合

- メーカーが手付の市場を作る
  - 「⚪︎年⚪︎月納品予定の◯◯の手付」を売り買いする。
  - 売り買い市場はメーカーが運営し、売り手から取引手数料を取る。
  - メーカーは「全ての手付の最終買取価格」を把握している。
    - 買い手は保有者に対して買取を申し入れることができる。
    - 保有者は「現物化宣言」をすることができ、現物化宣言された手付には買取申し込みができない。

- メーカーの運営
  - 全ての生産枠の「手付」を権利化する
  - 正規代理店には「優先枠」を儲けて、先に正規価格で販売する（正規代理店が手付金を払う）
  - 余った分は自由市場に流す

- メーカーのメリット
  - 手付金が先に入るのでキャッシュフローが改善する
  - マネーゲームをしたい人と実需がある人を分離できる。
  - 市場価格が販売価格を割り込んだとしても、手付金としての価値は残るので実需家には影響がない
  - キャンセルされかねない予約注文に振り回されなくなる。
  - 手付の市場価格から実需が読める

- 正規代理店のメリット
  転売屋を自由市場に誘導できるので、転売屋のクレームに付き合わずに済む。

## 高級な限定品の場合
完全に「競市」にしてしまい、メーカーは市場価格で販売することで、転売屋に利益を流さない。

### 入札システム
- 初回入札料を取る。「落札できた場合は、購入代金に充当。」
- 追加入札料も有料にする。これも「落札できた場合は、購入代金に充当。」
- メーカーから見ると「競り負けた人の手数料は全て利益」になる。

### 売り手から見たメリット
- 買い手がサンクコストを回収しようと勝手に値段を釣り上げてくれる。
- 小刻みに追加入札すると、追加入札料が嵩むので、買い手は一度に高い入札をするか、勝つまで入札するかのどちらかを迫られる。
